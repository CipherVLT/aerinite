# Aerinite — "Aero" picom profile
# Based on Aero-Glass-XFCE4's picom.conf, tuned for weak GPUs
# (target: AMD A6-9220/9225 "Stoney Ridge", Radeon R4, 2 cores).
#
# Switch profiles with:  ujust aero-glass on|off

backend = "glx";
vsync = true;
use-damage = true;              # only repaint what changed — big win on low-end GPUs
glx-no-stencil = true;

# Glass
blur-method = "dual_kawase";
blur-strength = 2;              # upstream default; 1 if it stutters, 3 for more frost
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock' && class_g != 'Xfce4-panel'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

frame-opacity = 0.5;
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = false;

# Win7-style soft shadows (cheap)
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -6;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c" ];

# Short fades so minimise/restore feels "Aero" without costing much
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

unredir-if-possible = true;     # fullscreen video/games bypass the compositor
detect-rounded-corners = true;
detect-client-opacity = true;
