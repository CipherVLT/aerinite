# Aerinite — "Aero" picom profile (full glass)
# Combines Xfseven's and Aero-Glass-XFCE4's recommended settings, kept light for
# low-end GPUs. Switch profiles with:  ujust aero-glass on|basic|off

backend = "glx";
vsync = true;
use-damage = true;              # only repaint what changed — big win on low-end GPUs

# Glass
blur-method = "dual_kawase";
blur-strength = 2;              # 1 if it stutters, 3 for more frost
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

frame-opacity = 0.7;            # see-through title bars and borders
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = false;

# Soft Windows 7-style shadows
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.4;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = false;

unredir-if-possible = true;     # fullscreen video bypasses the compositor
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
};
