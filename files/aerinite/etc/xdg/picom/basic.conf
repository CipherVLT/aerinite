# Aerinite — "Basic" picom profile (like Win7's "Windows 7 Basic" theme)
# No blur: frames are still translucent-looking via the theme, but no GPU blur pass.
# Use on battery or if the Aero profile stutters.

backend = "xrender";
vsync = true;
use-damage = true;

blur-background = false;
frame-opacity = 1.0;

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.3;
shadow-offset-x = -6;
shadow-offset-y = -4;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c" ];

fading = false;
unredir-if-possible = true;
