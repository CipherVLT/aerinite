# Builds an installer ISO from the published Aerinite image.
# Adapted from ublue-os/image-template (Apache-2.0). No secrets needed: the ISO is
# attached to the workflow run (Actions tab → this run → Artifacts) for download.
name: Build installer ISO

on:
  workflow_dispatch:   # run by hand from the Actions tab
  # Also runs automatically after a successful image build whose commit
  # message contains [iso], so a change can be tested end to end in one push.
  workflow_run:
    workflows: ["Build latest images"]
    types: [completed]
    branches: [main]
  # Re-run straight away when the installer settings change (uses the existing image)
  push:
    branches: [main]
    paths:
      - "disk_config/iso.toml"
      - ".github/workflows/build-disk.yml"
  pull_request:
    branches: [main]
    paths:
      - "disk_config/iso.toml"
      - ".github/workflows/build-disk.yml"

env:
  IMAGE_NAME: aerinite
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer ISO
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[iso]'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Lets the ISO build pull the image even if the package is still private
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Runs bootc-image-builder directly (same as the upstream action does) so that,
      # if it fails, its last lines are posted as an error note on the run.
      - name: Build ISO
        id: build
        run: |
          set -o pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          mkdir -p output
          note() { echo "::error title=$1::$(tail -n 40 "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          for img in "$IMAGE" "$BIB_IMAGE"; do
            sudo podman pull "$img" 2>&1 | tee pull.log || { echo "image: $img" >> pull.log; note "could not download an image" pull.log; exit 1; }
          done
          if ! sudo podman run --rm --privileged --pull=never \
                --security-opt label=type:unconfined_t \
                -v ./disk_config/iso.toml:/config.toml:ro \
                -v ./output:/output \
                -v /var/lib/containers/storage:/var/lib/containers/storage \
                "$BIB_IMAGE" --type anaconda-iso --use-librepo=True "$IMAGE" 2>&1 | tee bib.log; then
            note "bootc-image-builder failed" bib.log
            exit 1
          fi
          sudo chown -R "${USER_UID}:${USER_GID}" output
          ls -lR output
          echo "output-directory=$(pwd)/output" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to the workflow run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerinite-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
